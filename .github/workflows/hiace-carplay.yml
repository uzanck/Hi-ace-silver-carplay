name: HiAce CarPlay diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'carplay/**'
      - '.github/workflows/hiace-carplay.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: carplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --list --channel=3 > /tmp/sdk-packages.txt
          grep -E 'platforms;android-(37|CinnamonBun)|build-tools;37' /tmp/sdk-packages.txt || true
          "$SDKMANAGER" --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Test and build
        run: bash gradlew :shared:testDebugUnitTest :mobile:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HiAce-CarPlay-V1.0.0-diagnostic
          path: carplay/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
