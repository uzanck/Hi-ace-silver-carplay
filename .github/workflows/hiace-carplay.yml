name: HiAce CarPlay diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'carplay/**'
      - '.github/workflows/hiace-carplay.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: carplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --list --channel=3 > /tmp/sdk-packages.txt
          grep -E 'platforms;android-(37|CinnamonBun)|build-tools;37' /tmp/sdk-packages.txt || true
          "$SDKMANAGER" --channel=3 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Test and build
        env:
          HIACE_SIGNING_KEYSTORE_BASE64: ${{ secrets.HIACE_SIGNING_KEYSTORE_BASE64 }}
          HIACE_SIGNING_PASSWORD: ${{ secrets.HIACE_SIGNING_PASSWORD }}
        run: |
          if [[ -n "$HIACE_SIGNING_KEYSTORE_BASE64" && -n "$HIACE_SIGNING_PASSWORD" ]]; then
            umask 077
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/hiace-signing.p12"
            printf '%s' "$HIACE_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            export ANDROID_KEYSTORE_PASSWORD="$HIACE_SIGNING_PASSWORD"
            export ANDROID_KEY_ALIAS=hiace
            export ANDROID_KEY_PASSWORD="$HIACE_SIGNING_PASSWORD"
          elif [[ -n "$HIACE_SIGNING_KEYSTORE_BASE64" || -n "$HIACE_SIGNING_PASSWORD" ]]; then
            echo "::error::Both signing secrets are required"
            exit 1
          else
            echo "::warning::Temporary runner debug key; upgrades may require reinstall"
          fi
          bash gradlew :shared:testDebugUnitTest :mobile:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HiAce-CarPlay-V1.0.4-BulkUSB
          path: carplay/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
