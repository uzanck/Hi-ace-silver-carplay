name: HiAce CarPlay diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'carplay/**'
      - '.github/workflows/hiace-carplay.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: carplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-37' 'ndk;28.2.13676358'
      - name: Test and build
        run: bash gradlew :shared:testDebugUnitTest :mobile:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HiAce-CarPlay-V1.0.0-diagnostic
          path: carplay/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
